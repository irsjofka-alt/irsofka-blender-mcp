[project]
name = "irsofka-blender-mcp"
version = "0.2.1"
description = "IRSofka Blender MCP — the MIT BlenderMCP base taken over, gated by the station, and answered honestly when Blender is not there."
requires-python = ">=3.10"
# The base is not stdlib-only, and pretending otherwise is how an install "succeeds" and then
# fails at first import. Versions mirror upstream's own constraint so the vendored code is the
# code we tested, not a moving target.
dependencies = [
  "mcp>=1.26.0,<2",
  "httpx>=0.27.0",
]
license = "BUSL-1.1"
# The vendored MIT tree keeps its own licence; NOTICE names both, and packaging has to carry both
# files or a recipient gets a licence claim without the exception written next to it.
license-files = ["LICENSE", "NOTICE"]

# No console script, and no top-level `py-modules` install: dropping modules named `server` and
# `vram` into site-packages would claim two of the most collision-prone names in Python for a server
# that is meant to be run from a checkout. The base is packaged below because it is a real package
# (`blender_mcp`) with a namespaced path; our layer stays where it is.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `bridge` is gone: the clean-room add-on was deleted when the MIT base was taken over, and a
# py-modules list naming a missing file is a wheel that cannot be built. The list must match
# `git ls-files`, and it does.
# `py-modules = []` is not decoration: without it setuptools auto-discovers the root modules and puts
# `server.py` and `vram.py` at the top level of site-packages — the collision the comment above is
# about. Declaring it empty is the explicit "we do not install these".
py-modules = []
packages = ["blender_mcp", "blender_mcp.bundled"]
package-dir = {"blender_mcp" = "upstream/src/blender_mcp"}

[tool.setuptools.package-data]
blender_mcp = ["apps/*.html", "guides/*.md"]
